name: 🚀 Auto Build & Release — Melodyfy Rust & Mobile APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Windows x64 Desktop (.exe)
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust Toolchain (Stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: ⚡ Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "melodyfy-rust -> target"

      - name: 🔨 Compile Melodyfy Rust Desktop
        working-directory: melodyfy-rust
        run: cargo build --release

      - name: 📦 Prepare Windows Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/Melodyfy-Rust" | Out-Null
          Copy-Item "melodyfy-rust/target/release/melodyfy-rust.exe" "Melodyfy-Rust.exe" -Force
          Copy-Item "Melodyfy-Rust.exe" "dist/Melodyfy-Rust/Melodyfy-Rust.exe" -Force
          if (Test-Path "iniciar_melodyfy_rust.bat") {
            Copy-Item "iniciar_melodyfy_rust.bat" "dist/Melodyfy-Rust/" -Force
          }
          Copy-Item "README.md" "dist/Melodyfy-Rust/" -Force
          if (Test-Path "assets") {
            Copy-Item "assets" "dist/Melodyfy-Rust/assets" -Recurse -Force
          }
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "dist/Melodyfy-Rust/yt-dlp.exe"
          Compress-Archive -Path "dist/Melodyfy-Rust/*" -DestinationPath "Melodyfy-Rust-Windows-x64.zip" -Force

      - name: 📤 Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts
          path: |
            Melodyfy-Rust.exe
            Melodyfy-Rust-Windows-x64.zip

  build-android:
    name: Build Android Mobile (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔨 Build Android Release APK
        working-directory: melodyfy-mobile
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../Melodyfy-Mobile.apk

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Melodyfy-Mobile.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: 🏷️ Determine Release Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "🎧 Melodyfy — Desktop (.exe) & Mobile Android (.apk) (${{ steps.tag_info.outputs.tag }})"
          body: |
            ## 🎧 Melodyfy — Reproductor Nativo Libre, Rápido y Sin Anuncios
            
            ### 📥 Descargas Directas:
            - **Android (Smartphone / Tablet):** `Melodyfy-Mobile.apk` *(Arquitectura nativa Android con ForegroundService, controles en pantalla de bloqueo, InnerTube directo sin Python, Letras Karaoke LRCLIB y descargas offline `.m4a`)*.
            - **Windows Desktop:** `Melodyfy-Rust-Windows-x64.zip` o `Melodyfy-Rust.exe` *(Motor Rust nativo <25 MB RAM)*.
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            Melodyfy-Mobile.apk
            Melodyfy-Rust.exe
            Melodyfy-Rust-Windows-x64.zip
